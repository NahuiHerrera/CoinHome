<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinHome - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container-fluid p-0 d-flex flex-column" style="box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        
        <div class="text-center py-5 screen-error">
            </div>

        <div class="screen-status-body flex-grow-1 text-center px-4 d-flex flex-column justify-content-between">
            
            <div class="mt-4">
                <div class="error-icon mx-auto mb-5">X</div>
                
                <h3 class="font-poppins fw-semi-bold mb-4" style="font-size: 1.8rem;">No pudimos hacer su transferencia</h3>
                
                <p class="text-secondary px-3" style="font-size: 0.95rem;">
                    Esto se puede deber a la problemas de conexión a internet, falta de ingresos requeridos o fallos de la aplicación.
                </p>
                
                <p class="mt-5 mb-5 fw-medium" style="font-size: 1.05rem;">
                    Por favor, vuelva a intentar más tarde
                </p>
            </div>

            <div class="text-center pt-3 pb-4">
                <a href="index.html" class="btn-error-primary font-poppins text-center">Volver al inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
