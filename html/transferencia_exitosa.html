<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinHome - Éxito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container-fluid p-0 d-flex flex-column" style="box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        
        <div class="text-center py-4 screen-success">
            <div class="status-circle mx-auto"></div>
        </div>

        <div class="screen-status-body flex-grow-1 text-center px-4 d-flex flex-column justify-content-between">
            <div>
                <p class="fw-medium mt-3">Transferiste correctamente:</p>
                <h2 class="font-roboto-mono fw-medium mb-3">$10.000,00</h2>
                <p>a: (usuario X)</p>
                
                <div class="text-start mt-5">
                    <p>Banco</p>
                    <div class="mb-3 border-bottom border-secondary pb-1"></div>

                    <p>CBU del destino:</p>
                    <div class="mb-3 border-bottom border-secondary pb-1"></div>

                    <p>Fecha</p>
                    <div class="mb-5 border-bottom border-secondary pb-1"></div>
                </div>
            </div>

            <div class="text-center pt-3 pb-4">
                <a href="#" class="btn-bottom-primary font-poppins text-center d-inline-block" style="background-color: var(--color-principal); width: 80%; margin: 10px 0;">Compartir comprobante</a>
                
                <p><a href="#" class="text-secondary text-decoration-none fw-medium">Descargar comprobante</a></p>
                <p><a href="index.html" class="text-secondary text-decoration-none fw-medium">Volver al inicio</a></p>
            </div>
        </div>
    </div>
</body>
</html>
