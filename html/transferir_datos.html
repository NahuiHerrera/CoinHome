<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinHome - Transferir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container-fluid p-0 d-flex flex-column" style="box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        
        <div class="screen-header-color text-center py-3 font-poppins">
            Transferir
        </div>

        <div class="screen-white-body flex-grow-1 p-4 d-flex flex-column justify-content-between" style="padding-bottom: 0 !important;">
            
            <div>
                <p><a href="index.html" class="text-secondary text-decoration-none">Cancelar</a></p>

                <h5 class="fw-semi-bold mt-5 mb-4">Ingresar la cuenta a quién le hará la transferencia</h5>
                <label for="alias-cbu" class="form-label">Alias/cbu</label>
                <input type="text" class="form-control mb-5 border-0 border-bottom border-secondary" id="alias-cbu" style="border-radius: 0;">

                <h5 class="fw-semi-bold mt-5 mb-4">Ingresar el monto a transferir:</h5>
                
                <label for="pesos" class="form-label">Pesos</label>
                <div class="input-group mb-5">
                    <span class="input-group-text border-0 bg-white">$</span>
                    <input type="text" class="form-control border-0 border-bottom border-secondary" id="pesos" style="border-radius: 0;">
                </div>

                <label for="dolares" class="form-label">Dolares</label>
                <div class="input-group mb-5">
                    <span class="input-group-text border-0 bg-white">$</span>
                    <input type="text" class="form-control border-0 border-bottom border-secondary" id="dolares" style="border-radius: 0;">
                </div>
            </div>

            <div class="text-center pb-4 pt-2" style="background-color: white;">
                <a href="confirmar_transferencia.html" class="btn-bottom-primary font-poppins text-center" style="width: 100%; background-color: var(--color-principal); color: var(--color-texto-claro); margin: 0;">Continuar</a>
            </div>
        </div>
    </div>
</body>
</html>
