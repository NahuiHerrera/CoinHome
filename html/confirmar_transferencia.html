<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinHome - Confirmar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container-fluid p-0" style="max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

        <div class="screen-header-color text-center py-3 font-poppins">
            Pantalla de datos
        </div>

        <div class="screen-white-body p-4" style="min-height: 90vh;">
            <p><a href="transferir_datos.html" class="text-secondary text-decoration-none">Cancelar</a></p>

            <div class="btn-icono-circle mx-auto my-4" style="background-color: var(--color-fondo);"></div>

            <h5 class="fw-medium text-center">Vas a transferir:</h5>
            <h3 class="font-roboto-mono fw-medium text-center">$ 10.000,00</h3>
            <p class="text-center mb-5">(usuario X)</p>

            <label class="form-label">Banco</label>
            <div class="mb-3 border-bottom border-secondary pb-1"></div>
            <label class="form-label">CBU</label>
            <div class="mb-3 border-bottom border-secondary pb-1"></div>
            <label class="form-label">Alias</label>
            <div class="mb-3 border-bottom border-secondary pb-1"></div>
            <label class="form-label">CUIT/CUIL</label>
            <div class="mb-3 border-bottom border-secondary pb-1"></div>
            <label class="form-label">Motivo</label>
            <div class="mb-3 border-bottom border-secondary pb-1"></div>
            <label class="form-label">Comentario</label>
            <div class="mb-5 border-bottom border-secondary pb-1"></div>

            <div class="text-center py-3">
                <a href="transferencia_exitosa.html" class="btn-bottom-primary font-poppins text-center" style="background-color: var(--color-principal); width: 100%; margin-bottom: 10px;">Transferir</a>
                <a href="transferencia_error.html" class="d-block text-secondary text-decoration-none small mt-2">Error de Transferencia</a>
            </div>
        </div>
    </div>
</body>
</html>
